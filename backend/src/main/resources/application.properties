spring.application.name=rachai
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8081}
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@localhost:1522/FREEPDB1}
spring.datasource.username=${ORACLE_USERNAME:rachai}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
server.error.include-message=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
server.tomcat.max-http-form-post-size=16KB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.file-size-threshold=0
